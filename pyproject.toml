[project]
name = "taranis"
version = "0.2.0"
description = "Système souverain d'alerte météo par JEPA, cœur pédagogique TS-JEPA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Michel-Marie Maudet" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "torch>=2.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-jupyter>=0.25",
  "pymdown-extensions>=10.9",
]
era5 = [
  "cdsapi>=0.7",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taranis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "maxminddb>=3.1.1",
    "onnxruntime>=1.27.0",
    "onnxscript>=0.7.1",
    "skl2onnx>=1.20.0",
]
