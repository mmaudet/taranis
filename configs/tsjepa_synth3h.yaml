# Configuration TS-JEPA pour le dataset synthétique à pas 3h.
# Géométrie **identique** au réel (Tw=32, patch=4, n_patches=8) pour rendre
# le transfert sim-to-real possible.

dataset: data/synth3h_windows.npz

model:
  Tw: 32
  n_canaux: 4
  patch_len: 4
  d_model: 64
  n_layers_encoder: 3
  n_layers_predictor: 2
  n_heads: 4
  mlp_ratio: 2.0
  tau_ema: 0.996

trainer:
  n_steps: 2000
  batch_size: 128
  val_every: 100
  val_batches: 4
  log_every: 100

  lr_max: 1.0e-3
  lr_min: 1.0e-5
  warmup_steps: 100
  weight_decay: 1.0e-4
  grad_clip: 1.0

  tau_start: 0.996
  tau_end: 0.999

  n_blocks: 2
  block_size: 2

  seed: 0
  device: cpu

output: runs/tsjepa_synth3h
