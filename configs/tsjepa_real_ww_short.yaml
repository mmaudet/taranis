# TS-JEPA petite fenêtre pour usage capteur portable.
# Tw = 8 pas SYNOP (24 h de contexte au pas 3h). Patch = 1 pas, soit 8 patches
# par fenêtre. Masquage 2 blocs de 2 (50 % masqué), même intensité que les
# autres configs de l'étape 6.
#
# Le dataset porte les étiquettes H=2 (6h horizon) pour la sonde aval, mais
# JEPA ignore les étiquettes (auto-supervisé).

dataset: data/real_ww_h2_windows.npz

model:
  Tw: 8
  n_canaux: 5
  patch_len: 1
  d_model: 64
  n_layers_encoder: 3
  n_layers_predictor: 2
  n_heads: 4
  mlp_ratio: 2.0
  tau_ema: 0.996

trainer:
  n_steps: 4000
  batch_size: 128
  val_every: 200
  val_batches: 4
  log_every: 200

  lr_max: 1.0e-3
  lr_min: 1.0e-5
  warmup_steps: 200
  weight_decay: 1.0e-4
  grad_clip: 1.0

  tau_start: 0.996
  tau_end: 0.999

  n_blocks: 2
  block_size: 2

  seed: 0
  device: cpu

output: runs/tsjepa_real_ww_short
