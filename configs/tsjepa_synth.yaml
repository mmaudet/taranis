# Configuration TS-JEPA pour le dataset synthétique.
# Pas de temps 10 min, Tw = 96, patch = 8, 12 patches par fenêtre.
# Calibrée pour tourner en quelques minutes sur CPU tout en montrant
# clairement le comportement d'apprentissage et l'absence de collapse.

dataset: data/synthetic_windows.npz

model:
  Tw: 96
  n_canaux: 4
  patch_len: 8
  d_model: 64
  n_layers_encoder: 3
  n_layers_predictor: 2
  n_heads: 4
  mlp_ratio: 2.0
  tau_ema: 0.996  # remplacé par le planning tau_start/tau_end du trainer

trainer:
  n_steps: 2000
  batch_size: 128
  val_every: 100
  val_batches: 4
  log_every: 100

  lr_max: 1.0e-3
  lr_min: 1.0e-5
  warmup_steps: 100
  weight_decay: 1.0e-4
  grad_clip: 1.0

  tau_start: 0.996
  tau_end: 0.999

  n_blocks: 2
  block_size: 3

  seed: 0
  device: cpu

output: runs/tsjepa_synth
