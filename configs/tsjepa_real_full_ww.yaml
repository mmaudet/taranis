# TS-JEPA sur SYNOP full avec étiquettes WMO orage.
# Même architecture que l'étape 9 (5 canaux). Seul le dataset (les labels)
# change, ce qui rend la comparaison lisible.
# Note : le pré-entraînement JEPA est agnostique aux labels, donc entraîner
# sur ce dataset donne exactement les mêmes embeddings que sur le dataset
# de l'étape 9 à seed identique. On peut donc réutiliser le checkpoint de
# l'étape 9. Cette config existe pour cohérence documentaire.

dataset: data/real_full_ww_windows.npz

model:
  Tw: 32
  n_canaux: 5
  patch_len: 4
  d_model: 64
  n_layers_encoder: 3
  n_layers_predictor: 2
  n_heads: 4
  mlp_ratio: 2.0
  tau_ema: 0.996

trainer:
  n_steps: 4000
  batch_size: 128
  val_every: 200
  val_batches: 4
  log_every: 200

  lr_max: 1.0e-3
  lr_min: 1.0e-5
  warmup_steps: 200
  weight_decay: 1.0e-4
  grad_clip: 1.0

  tau_start: 0.996
  tau_end: 0.999

  n_blocks: 2
  block_size: 2

  seed: 0
  device: cpu

output: runs/tsjepa_real_full_ww
