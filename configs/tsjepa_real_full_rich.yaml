# TS-JEPA sur SYNOP full enrichi (5 canaux, 1.9 M fenêtres train).
# Reste sur CPU pédagogique pour l'étape 9. La géométrie est identique aux
# runs de l'étape 6, seuls le dataset (plus grand, plus riche) et n_canaux
# changent. Volume × 50, canaux × 1.25. Signal attendu : le rang effectif
# des embeddings doit être plus dispersé.

dataset: data/real_full_rich_windows.npz

model:
  Tw: 32
  n_canaux: 5
  patch_len: 4
  d_model: 64
  n_layers_encoder: 3
  n_layers_predictor: 2
  n_heads: 4
  mlp_ratio: 2.0
  tau_ema: 0.996

trainer:
  n_steps: 4000   # doublé par rapport à l'étape 6 pour donner sa chance au signal
  batch_size: 128
  val_every: 200
  val_batches: 4
  log_every: 200

  lr_max: 1.0e-3
  lr_min: 1.0e-5
  warmup_steps: 200
  weight_decay: 1.0e-4
  grad_clip: 1.0

  tau_start: 0.996
  tau_end: 0.999

  n_blocks: 2
  block_size: 2

  seed: 0
  device: cpu

output: runs/tsjepa_real_full_rich
